server.port=8080

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mariadb://mariadb:3306/caishen?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:caishen}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

spring.mail.host=${MAIL_HOST:smtp.mail.ovh.net}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

mail.enabled=${MAIL_ENABLED:true}
mail.from=${MAIL_FROM:}
mail.debug=false

url.frontend=${FRONTEND_BASE_URL:https://caishen.laurent-chen.fr}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

jwt.expiration-date=600000
jwt.refresh-expiration-date=604800000
jwt.secret=${JWT_SECRET}

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:caishen}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
