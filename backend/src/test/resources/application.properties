spring.datasource.url=jdbc:h2:mem:caishen-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

url.frontend=http://localhost:4200
mail.enabled=false

jwt.expiration-date=600000
jwt.refresh-expiration-date=604800000
jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret-test-secret-test-secret

spring.mail.host=localhost
spring.mail.port=1025
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
