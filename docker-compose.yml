services:
  mariadb:
    image: mariadb:11.8
    container_name: caishen-db
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      MARIADB_DATABASE: caishen
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_USER: caishen
      MARIADB_PASSWORD: ${DB_PASSWORD:-caishen}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: caishen-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: caishen
      DB_PASSWORD: ${DB_PASSWORD:-caishen}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://caishen.laurent-chen.fr}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-change-me-change-me-change-me-change-me}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.mail.ovh.net}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:caishen@laurent-chen.fr}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: caishen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${CAISHEN_FRONTEND_PORT:-9003}:80"

volumes:
  mariadb_data:
