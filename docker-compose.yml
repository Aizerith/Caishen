services:
  mariadb:
    image: mariadb:11.8
    container_name: caishen-db
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      MARIADB_DATABASE: caishen
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_USER: caishen
      MARIADB_PASSWORD: ${DB_PASSWORD:-caishen}
    ports:
      - "3406:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: caishen-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: caishen
      DB_PASSWORD: ${DB_PASSWORD:-caishen}
      FRONTEND_BASE_URL: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-change-me-change-me-change-me-change-me}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: caishen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mariadb_data:
