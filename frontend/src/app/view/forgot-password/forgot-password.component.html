<div class="app-form-page">
  <form class="app-form" [formGroup]="forgotPasswordForm">
    <h2 class="app-title">Mot de passe oublie</h2>

    @if (isSent()) {
      <p class="text-base-content/70">
        Si un compte existe avec cette adresse, un email vient d'etre envoye.
      </p>
      <a routerLink="/login" class="btn btn-primary w-full">Retour a la connexion</a>
    } @else {
      <app-caishen-custom-form-input
        [placeholder]="'mail@exemple.com'"
        [icon]="'/icons/mail_icon.svg'"
        [type]="'email'"
        [inputForm]="getFormFromName('email')"
        [hasError]="(forgotPasswordForm.get('email')?.errors?.['required'] || forgotPasswordForm.get('email')?.errors?.['pattern']) && forgotPasswordForm.get('email')?.touched"
        [errorMessage]="'L adresse email est invalide'"
      />

      <button type="button" class="btn btn-primary w-full" [disabled]="forgotPasswordForm.invalid || isLoading()" (click)="requestPasswordReset()">
        Recevoir le lien
      </button>
      <a routerLink="/login" class="text-center underline">Retour a la connexion</a>
    }
  </form>
</div>
