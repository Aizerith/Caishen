<div class="app-form-page">
  <form class="app-form" [formGroup]="resetPasswordForm">
    <h2 class="app-title">Nouveau mot de passe</h2>

    @if (hasInvalidToken()) {
      <p class="text-error">Ce lien est invalide ou expire.</p>
      <a routerLink="/forgot-password" class="btn btn-primary w-full">Recevoir un nouveau lien</a>
    } @else {
      <app-caishen-custom-form-input
        [placeholder]="'Password'"
        [icon]="'/icons/password_icon.svg'"
        [type]="'password'"
        [inputForm]="getFormFromName('password')"
        [hasError]="(resetPasswordForm.get('password')?.errors?.['required'] || resetPasswordForm.get('password')?.errors?.['pattern']) && resetPasswordForm.get('password')?.touched"
        [errorMessage]="'Doit contenir au moins une minuscule, une majuscule, 8 a 20 caracteres et aucun espace.'"
      />

      <app-caishen-custom-form-input
        [placeholder]="'Confirm password'"
        [icon]="'/icons/password_icon.svg'"
        [type]="'password'"
        [inputForm]="getFormFromName('passwordConfirmation')"
        [hasError]="(resetPasswordForm.get('passwordConfirmation')?.errors?.['required'] || resetPasswordForm.get('passwordConfirmation')?.errors?.['matching']) && resetPasswordForm.get('passwordConfirmation')?.touched"
        [errorMessage]="'Les mots de passe ne correspondent pas.'"
      />

      <button type="button" class="btn btn-primary w-full" [disabled]="resetPasswordForm.invalid || isLoading()" (click)="confirmPasswordReset()">
        Modifier le mot de passe
      </button>
      <a routerLink="/login" class="text-center underline">Retour a la connexion</a>
    }
  </form>
</div>
