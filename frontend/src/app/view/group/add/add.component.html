<div class="app-page app-page-center">
  <section class="app-panel">
    <header class="app-panel-header">
      <h1 class="app-title">{{ 'groups.add' | transloco }}</h1>
    </header>
    <div class="app-content">
      <form class="app-card flex flex-col gap-4" [formGroup]="groupForm" (ngSubmit)="addNewGroup()">
        <app-caishen-custom-form-input [placeholder]="'groups.titlePlaceholder' | transloco"
                                       [type]="'text'"
                                       [inputForm]="getFormFromName('title')"
                                       [hasError]="false">
        </app-caishen-custom-form-input>
        <button type="submit" class="btn btn-primary w-full sm:w-auto sm:self-end" [disabled]="groupForm.invalid">{{ 'common.validate' | transloco }}</button>
      </form>
    </div>
  </section>
</div>
