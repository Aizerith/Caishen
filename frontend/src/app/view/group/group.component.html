<div class="app-page">
  <section class="app-panel">
    <header class="app-panel-header app-panel-header-inline">
      <h1 class="app-title">Groupes</h1>
      <button type="button" class="btn btn-accent btn-square relative p-0" aria-label="Ajouter un groupe"
              (click)="navigateToAddGroup()">
        <span aria-hidden="true" class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 -translate-y-1/2 rounded bg-current"></span>
        <span aria-hidden="true" class="absolute left-1/2 top-1/2 h-5 w-0.5 -translate-x-1/2 -translate-y-1/2 rounded bg-current"></span>
      </button>
    </header>
    <div *ngIf="groups$ | async as groupList" class="app-content">
      <article *ngFor="let group of groupList"
               role="button"
               tabindex="0"
               class="app-card app-row cursor-pointer"
               (click)="navigateToGroupId(group.id)"
               (keydown.enter)="navigateToGroupId(group.id)">
        <h2 class="app-row-title">{{ group.title }}</h2>
        <span class="btn btn-primary btn-square self-end sm:self-auto">
          <img src="/icons/right-arrow.svg" alt="">
        </span>
      </article>
    </div>
  </section>
</div>
