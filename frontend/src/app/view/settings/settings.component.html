<div class="app-page app-page-center">
  <section class="app-panel">
    <header class="app-panel-header">
      <h1 class="app-title">Settings</h1>
    </header>

    <div class="app-content">
      <section class="app-card flex flex-col gap-3">
        <h2 class="text-lg font-semibold">Th&egrave;mes</h2>
        <div class="dropdown w-full">
          <button type="button" tabindex="0" class="btn w-full justify-between sm:w-56">
            {{ theme() }}
            <span class="text-sm opacity-60">v</span>
          </button>
          <ul tabindex="0" class="dropdown-content z-10 mt-2 w-full rounded-box bg-base-300 p-2 shadow-2xl sm:w-56">
            @for (themeName of themes; track themeName) {
              <li>
                <input
                  type="radio"
                  name="theme-dropdown"
                  class="theme-controller btn btn-sm btn-block btn-ghost justify-start"
                  [attr.aria-label]="themeName[0].toUpperCase() + themeName.slice(1)"
                  [value]="themeName"
                  [checked]="theme() === themeName"
                  (change)="changeTheme(themeName)" />
              </li>
            }
          </ul>
        </div>
      </section>

      <section class="app-card flex flex-col gap-3">
        <h2 class="text-lg font-semibold">D&eacute;connexion</h2>
        <button type="button" class="btn btn-error w-full sm:w-auto sm:self-start" (click)="logout()">Logout</button>
      </section>
    </div>
  </section>
</div>
