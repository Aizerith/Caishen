<div class="app-page app-page-center">
  <section class="app-panel">
    <div class="app-content">
      <div class="app-card flex flex-col items-center gap-5 text-center">
        @if (isLogged()) {
          @if (errorMessage) {
            <h1 class="app-title text-error">{{ errorMessage }}</h1>
          } @else {
            <h1 class="app-title">{{ 'join.joined' | transloco }}</h1>
            <button type="button" class="btn btn-accent w-full sm:w-auto" (click)="navigateToGroup()">{{ 'join.seeGroups' | transloco }}</button>
          }
        } @else {
          <h1 class="app-title">{{ 'join.loginThenClick' | transloco }}</h1>
          <button type="button" class="btn btn-accent w-full sm:w-auto" (click)="navigateToLogin()">{{ 'join.login' | transloco }}</button>
        }
      </div>
    </div>
  </section>
</div>
