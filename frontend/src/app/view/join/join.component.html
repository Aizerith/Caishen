<div class="flex w-full h-full justify-center items-center">
  <div class="card w-caishen-content h-[90%] bg-base-200 card-xl shadow-sm justify-center">
    <div>
      <div class="card-body overflow-auto pt-2">
        <div class="card bg-base-100 card-xs shadow-sm p-10">
          <ng-container *ngIf="isLogged(); else notLogged">
            <div class="card-body items-center gap-6">
              <h1 *ngIf="!errorMessage; else error" class="card-title text-xl text-center">Vous avez rejoint le groupe</h1>
              <button class="btn btn-accent"><span
                class="text-md leading-3.5" (click)="navigateToGroup()">Voir mes groupes</span></button>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #notLogged>
  <div class="card-body items-center gap-6">
    <h1 class="card-title text-xl text-center">Veuillez vous connecter, puis cliquez à nouveau sur le lien</h1>
    <button class="btn btn-accent"><span
      class="text-md leading-3.5" (click)="navigateToLogin()">Se connecter</span></button>
  </div>
</ng-template>
<ng-template #error>
  <h1 class="card-title text-xl text-center">{{ errorMessage }}</h1>
</ng-template>
