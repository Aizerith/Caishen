<button type="button" [class]="triggerButtonClass" (click)="openModal()">
  {{ triggerLabel | transloco }}
</button>

<dialog #expenseModal id="add_expense_modal" class="modal">
  <form class="modal-box flex max-h-[90dvh] w-[calc(100vw-1.5rem)] max-w-xl flex-col gap-5 overflow-y-auto"
        [formGroup]="expenseForm"
        (ngSubmit)="onValidate()">
    <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="closeModal()">x</button>

    <h1 class="app-title pr-8">{{ titleLabel | transloco }}</h1>

    <div class="flex flex-col gap-1">
      <h2 class="text-sm font-semibold">{{ 'expense.title' | transloco }}</h2>
      <app-caishen-custom-form-input [placeholder]="'expense.titlePlaceholder' | transloco"
                                     [type]="'text'"
                                     [inputForm]="getFormFromName('title')"
                                     [hasError]="false">
      </app-caishen-custom-form-input>
    </div>

    <div class="flex flex-col gap-1">
      <h2 class="text-sm font-semibold">{{ 'expense.amount' | transloco }}</h2>
      <app-caishen-custom-form-input [placeholder]="'0,00'"
                                     [type]="'number'"
                                     [inputForm]="getFormFromName('amount')"
                                     [hasError]="false">
      </app-caishen-custom-form-input>
    </div>

    <div class="grid gap-3 sm:grid-cols-5">
      <div class="flex flex-col gap-1 sm:col-span-3">
        <h2 class="text-sm font-semibold">{{ 'expense.paidBy' | transloco }}</h2>
        <select class="select w-full" [formControl]="getFormFromName('payerId')">
          <option disabled selected>{{ 'expense.chooseMember' | transloco }}</option>
          @for (member of memberList; track member.id) {
            <option [value]="member.id">
              {{ member.name }}
            </option>
          }
        </select>
      </div>
      <div class="flex flex-col gap-1 sm:col-span-2">
        <h2 class="text-sm font-semibold">{{ 'expense.when' | transloco }}</h2>
        <input type="date" class="input w-full" [formControl]="getFormFromName('expenseDate')">
      </div>
    </div>

    <div class="flex w-full flex-col gap-3">
      <h2 class="text-sm font-semibold">{{ 'expense.participants' | transloco }}</h2>
      @for (member of memberList; track member.id) {
        <label class="label min-h-11 w-full items-center justify-between rounded-box border border-base-300 bg-base-100 px-3">
          <span class="font-medium">
            {{ member.name }}
          </span>
          <input
            type="checkbox"
            class="checkbox checkbox-primary checkbox-sm shrink-0"
            [value]="member.id"
            [checked]="isChecked(member.id)"
            (change)="onCheckboxChange($event)"/>
        </label>
      }
    </div>

    <button type="submit" class="btn btn-primary w-full"
            [disabled]="expenseForm.invalid || !getFormFromName('participants').value.length">
      {{ submitLabel | transloco }}
    </button>
  </form>
</dialog>
